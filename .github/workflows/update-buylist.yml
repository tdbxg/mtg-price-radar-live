name: Update Card Kingdom buylist

on:
  workflow_dispatch:
  schedule:
    - cron: "20 1 * * *"
    - cron: "20 13 * * *"

permissions:
  contents: write

concurrency:
  group: mtg-price-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh static data
        run: python scripts/update_site_data.py

      - name: Refresh public Hareruya buylist listing
        run: python scripts/update_hareruya_prices.py --listing-only
        continue-on-error: true

      - name: Incrementally probe high-value Hareruya names
        run: python scripts/probe_hareruya_priority.py --limit 120 --min-cash-usd 5 --workers 3
        continue-on-error: true

      - name: Validate generated files
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path

          required = [
              Path("data.json.gz"),
              Path("data_fast.json.gz"),
              Path("movers.json"),
              Path("last_update.json"),
              Path("exports/ck_buylist_top5000.csv"),
              Path("exports/ck_buylist_fast_high_recent.csv"),
              Path("exports/ck_buylist_full.csv.gz"),
              Path("exports/manifest.json"),
          ]
          for path in required:
              if not path.exists() or path.stat().st_size <= 0:
                  raise SystemExit(f"missing or empty: {path}")

          with gzip.open("data.json.gz", "rt", encoding="utf-8") as f:
              payload = json.load(f)
          meta = payload.get("meta", {})
          if meta.get("cards", 0) < 100000:
              raise SystemExit(f"unexpected card count: {meta.get('cards')}")
          if not meta.get("cardKingdomCreatedAt"):
              raise SystemExit("missing Card Kingdom timestamp")
          if len(payload.get("sets", [])) < 300:
              raise SystemExit(f"unexpected set count: {len(payload.get('sets', []))}")
          market_fallback = meta.get("scryfallMarketSkipped") == "bulk_download_unavailable"
          if not market_fallback and meta.get("scryfallMarketMatchedUsd", 0) < 50000:
              raise SystemExit("missing Scryfall USD market references")
          if not market_fallback and meta.get("scryfallMarketMatchedEur", 0) < 50000:
              raise SystemExit("missing Scryfall EUR market references")

          with gzip.open("data_fast.json.gz", "rt", encoding="utf-8") as f:
              fast = json.load(f)
          if fast.get("meta", {}).get("fullCards", 0) < 100000:
              raise SystemExit("fast payload missing fullCards")
          if len(fast.get("sets", [])) < 300:
              raise SystemExit("fast payload missing full set index")

          with open("movers.json", "r", encoding="utf-8") as f:
              movers = json.load(f)
          if not movers.get("daily") or not movers.get("weekly"):
              raise SystemExit("movers payload missing daily or weekly sections")
          if "changedRows" not in movers["daily"] or "changedRows" not in movers["weekly"]:
              raise SystemExit("movers payload missing changedRows")
          sources = movers.get("marketSources", {})
          if "tcgplayer" not in sources or "cardmarket" not in sources:
              raise SystemExit("movers payload missing market source sections")

          with open("hareruya_prices.json", "r", encoding="utf-8") as f:
              hareruya = json.load(f)
          if "meta" not in hareruya or "items" not in hareruya:
              raise SystemExit("hareruya snapshot malformed")

          print(json.dumps(meta, ensure_ascii=False, indent=2))
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json.gz data_fast.json.gz movers.json last_update.json hareruya_targets.json hareruya_prices.json hareruya_probe_state.json exports/ck_buylist_top5000.csv exports/ck_buylist_fast_high_recent.csv exports/ck_buylist_full.csv.gz exports/manifest.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update Card Kingdom MTG buylist data"
            git push
          fi
